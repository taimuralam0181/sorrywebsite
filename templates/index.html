<!DOCTYPE html>
<html>
<head>
    <title>OCR Scanner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>OCR Scanner</h1>
    <div class="subtitle">Upload an image to extract handwritten text</div>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="image" required>
        <button type="submit">Extract Text</button>
    </form>

    {% if image %}
        <img src="{{ image }}">
    {% endif %}

    {% if text %}
        <div class="result">
            {{ text }}
        </div>
    {% endif %}

</div>

</body>
</html>
